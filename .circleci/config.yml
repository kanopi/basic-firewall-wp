# Nothing here is allowed to fail softly. A security plugin whose test matrix is
# advisory is a security plugin nobody has tested.

# 8.1 is the floor, declared in composer.json, in the plugin header, in
# readme.txt, and enforced at runtime by the guard in basic-firewall.php. It is
# also what config.platform resolves the lock against, so it is the version the
# shipped dependency tree is chosen for.
PHP_FLOOR: &PHP_FLOOR "8.1"

# Not the floor. PHP-Scoper needs 8.3, and it is the only thing that runs on
# this PHP: the tree it rewrites is installed from the plugin's own lock. The
# zip is identical whichever PHP builds it.
PHP_TOOLS: &PHP_TOOLS "8.3"

MYSQL_IMAGE: &MYSQL_IMAGE "cimg/mysql:8.0"

# Release tags: 1.0.0, v1.0.0, and pre-releases such as 1.1.0-rc.1.
#
# CircleCI does not run a job for a tag unless that job carries a tag filter,
# and a job whose requirement did not run does not run either. So EVERY job in
# the workflow carries this, not just the release job -- otherwise a tag build
# silently runs nothing and publishes nothing, and says so nowhere.
RELEASE_TAGS: &RELEASE_TAGS
  tags:
    only: /^v?\d+\.\d+\.\d+.*/

# gh, which neither cimg image carries. Pinned, and checked against the
# checksum GitHub publishes for it, because this binary is handed a token that
# can write releases.
GH_VERSION: &GH_VERSION "2.101.0"
GH_SHA256: &GH_SHA256 "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8"

version: 2.1

commands:
  composer_install:
    description: Install dependencies, cached against the lock file.
    steps:
      - restore_cache:
          name: Restore Composer cache
          keys:
            # The PHP version is in the key because the cache holds vendor/
            # itself. The lock resolves identically on every version -- that is
            # what config.platform buys -- but a cache shared across images is
            # a bet on that staying true.
            - composer-v1-{{ checksum "composer.lock" }}-{{ arch }}-<< parameters.php >>
      - run:
          name: Install dependencies
          command: composer install --no-interaction --no-progress
      - save_cache:
          name: Save Composer cache
          key: composer-v1-{{ checksum "composer.lock" }}-{{ arch }}-<< parameters.php >>
          paths:
            - vendor
    parameters:
      php:
        type: string

  install_wp_cli:
    description: WP-CLI, which the cimg/php images do not carry.
    steps:
      - run:
          name: Install WP-CLI
          command: |
            curl -fsSL -o /tmp/wp-cli.phar \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            chmod +x /tmp/wp-cli.phar
            sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
            wp --info --allow-root

jobs:
  static:
    docker:
      - image: cimg/php:<< parameters.php >>
    parameters:
      php:
        type: string
        default: *PHP_FLOOR
    steps:
      - checkout
      - composer_install:
          php: << parameters.php >>

      # The plugin claims PHP 8.1, so nothing it ships may require more. The
      # lock is resolved against that floor by config.platform; this asserts it,
      # because the failure mode is a fatal on a customer's site rather than
      # anything a test would catch.
      - run:
          name: The shipped tree must install on the declared floor
          command: composer check-platform-reqs --no-dev
      - run:
          name: WordPress Coding Standards
          command: composer lint
      - run:
          name: PHPStan
          command: composer analyse

  unit:
    docker:
      - image: cimg/php:<< parameters.php >>
    parameters:
      php:
        type: string
    steps:
      - checkout
      - composer_install:
          php: << parameters.php >>
      - run:
          name: Unit tests
          command: |
            mkdir -p /tmp/test-results
            vendor/bin/phpunit --testsuite unit \
              --log-junit /tmp/test-results/unit.xml
      - store_test_results:
          path: /tmp/test-results

  integration:
    docker:
      - image: cimg/php:<< parameters.php >>
        environment:
          # The plugin is symlinked into a throwaway site, and PHP resolves
          # __DIR__ through the symlink back to the checkout, so the test
          # bootstrap cannot find WordPress by walking up. It is told where the
          # site is instead.
          BASIC_FIREWALL_WP_ROOT: /tmp/wp
      - image: *MYSQL_IMAGE
        environment:
          MYSQL_ROOT_PASSWORD: << pipeline.parameters.db_password >>
          MYSQL_DATABASE: wordpress_test
    parameters:
      php:
        type: string
      wordpress:
        type: string
    steps:
      - checkout
      - composer_install:
          php: << parameters.php >>
      - install_wp_cli
      - run:
          name: Wait for MySQL
          command: dockerize -wait tcp://127.0.0.1:3306 -timeout 2m
      - run:
          name: Install WordPress << parameters.wordpress >>
          command: |
            wp core download --version=<< parameters.wordpress >> --path=/tmp/wp --allow-root
            wp config create --path=/tmp/wp --dbname=wordpress_test --dbuser=root \
              --dbpass='<< pipeline.parameters.db_password >>' --dbhost=127.0.0.1 --allow-root
            wp core install --path=/tmp/wp --url=http://localhost:8080 \
              --title=CI --admin_user=admin --admin_password=password \
              --admin_email=ci@example.com --skip-email --allow-root
      - run:
          name: Link the plugin into the site
          command: |
            mkdir -p /tmp/wp/wp-content/plugins
            ln -s "$PWD" /tmp/wp/wp-content/plugins/basic-firewall
            wp plugin activate basic-firewall --path=/tmp/wp --allow-root
      - run:
          name: Integration tests
          command: |
            mkdir -p /tmp/test-results
            vendor/bin/phpunit -c phpunit-integration.xml.dist \
              --log-junit /tmp/test-results/integration.xml

      # The only tests here that exercise the mu-plugin, the compiled file on
      # disk, the library's parse cache and the web server together -- which is
      # where every defect this plugin has shipped so far lived.
      - run:
          name: Serve the site
          command: php -S 127.0.0.1:8080 -t /tmp/wp
          background: true
      - run:
          name: Wait for the site
          command: dockerize -wait tcp://127.0.0.1:8080 -timeout 1m
      - run:
          name: End-to-end tests over real HTTP
          command: |
            mkdir -p /tmp/test-results
            BFW_E2E_URL=http://127.0.0.1:8080 vendor/bin/phpunit -c phpunit-e2e.xml.dist \
              --log-junit /tmp/test-results/e2e.xml

      # Every subcommand, through `wp` rather than through PHP. What PHPUnit
      # cannot reach is everything WP-CLI owns: whether a method is registered
      # as a subcommand at all, whether its `## OPTIONS` block parses, and what
      # the process exits with -- including that a destructive command exits
      # NON-zero when it refuses, which is the one that has actually broken.
      #
      # Last in the job, and destructive: it replaces the rule set and empties
      # the block list on a site that is thrown away with the container.
      - run:
          name: WP-CLI commands
          environment:
            BFW_WP: wp --path=/tmp/wp --allow-root
            BFW_CLI_DESTRUCTIVE: 1
          command: bash tests/cli/commands.sh
      - store_test_results:
          path: /tmp/test-results

  package:
    docker:
      - image: cimg/php:<< parameters.php >>
      - image: *MYSQL_IMAGE
        environment:
          MYSQL_ROOT_PASSWORD: << pipeline.parameters.db_password >>
          MYSQL_DATABASE: wordpress_package
    parameters:
      php:
        type: string
        default: *PHP_TOOLS
    steps:
      - checkout
      - install_wp_cli
      - run:
          name: Build the zip
          command: bash build/build-zip.sh

      # The point of the whole exercise: a zip that works where there is no
      # Composer at all. A clean WordPress with nothing of this plugin on it,
      # and the Composer binary removed from PATH before the zip goes near it.
      - run:
          name: Wait for MySQL
          command: dockerize -wait tcp://127.0.0.1:3306 -timeout 2m
      - run:
          name: A clean WordPress, with no Composer
          command: |
            wp core download --path=/tmp/clean --allow-root
            wp config create --path=/tmp/clean --dbname=wordpress_package --dbuser=root \
              --dbpass='<< pipeline.parameters.db_password >>' --dbhost=127.0.0.1 --allow-root
            wp core install --path=/tmp/clean --url=http://127.0.0.1:8081 \
              --title=Package --admin_user=admin --admin_password=password \
              --admin_email=ci@example.com --skip-email --allow-root
            sudo mv "$(command -v composer)" /usr/local/bin/composer.hidden
            ! command -v composer
            echo "Composer is not on PATH."
      - run:
          name: Serve the clean site
          command: php -S 127.0.0.1:8081 -t /tmp/clean
          background: true
      - run:
          name: Wait for the clean site
          command: dockerize -wait tcp://127.0.0.1:8081 -timeout 1m

      # Then install the zip through `wp plugin install` -- the upload path --
      # activate it, add a block rule, and prove over HTTP that the rule refuses
      # the request it matches and allows one it does not. Deactivate and
      # uninstall must both exit 0 and leave nothing behind. A zip that fatals
      # on activation, loads unscoped, or loads and enforces nothing fails here.
      # Runnable locally against any throwaway site; see the script's header.
      - run:
          name: Activate the zip and make it refuse a request
          environment:
            BFW_WP: wp --path=/tmp/clean --allow-root
            BFW_SMOKE_URL: http://127.0.0.1:8081
          command: bash tests/package/smoke.sh build/dist/basic-firewall-*.zip
      - store_artifacts:
          path: build/dist
          destination: zip

      # Handed to the release job on a tag, so the zip published is byte for
      # byte the one that was just installed and exercised, not a rebuild.
      - persist_to_workspace:
          root: build
          paths:
            - dist

  # Cheap and first, on every branch as well as on tags: a version bump that
  # missed one of the places the version is stated is caught when it is made,
  # not on release day. On a tag the script also holds the tag and the newest
  # CHANGELOG heading to the same version (it reads CIRCLE_TAG itself).
  versions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Every stated version agrees
          command: bash build/check-versions.sh

  # Tag builds only, and only once everything else has passed. See the filters
  # on it in the workflow: it can never run for a branch.
  release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: build
      - run:
          name: Refuse anything that is not a tag build
          command: |
            if [ -z "${CIRCLE_TAG:-}" ]; then
              echo "The release job only publishes from a tag build." >&2
              exit 1
            fi
      - run:
          name: Install gh
          environment:
            GH_VERSION: *GH_VERSION
            GH_SHA256: *GH_SHA256
          command: |
            curl -fsSL -o /tmp/gh.tar.gz \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
            tar -xzf /tmp/gh.tar.gz -C /tmp
            sudo mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            gh --version

      # GITHUB_TOKEN comes from the `basic-firewall-release` context. See
      # README, "Releasing", for what it must be allowed to do.
      - run:
          name: Publish the GitHub Release
          command: |
            bash build/publish-release.sh "$CIRCLE_TAG" \
              "build/dist/basic-firewall-${CIRCLE_TAG#v}.zip"

parameters:
  db_password:
    type: string

    # Not a secret: an ephemeral database that exists for one job and is thrown
    # away with the container. It is long on purpose. CredentialHandlingTest
    # searches the compiled configuration for the literal password to prove it
    # never reaches disk, and skips that search -- loudly -- when the password
    # is short enough for the search to prove nothing. A two-character password
    # makes the assertion meaningless, which is the state the ddev site is in.
    #
    # A pipeline parameter rather than a YAML anchor because it is needed inside
    # a command string, and an anchor cannot be referenced from one.
    default: "circleci-integration-password-not-a-secret"

workflows:
  ci:
    # Every job carries RELEASE_TAGS. See its definition: without it a job does
    # not run for a tag, and the release job that requires it never runs either.
    jobs:
      - versions:
          filters: *RELEASE_TAGS
      - static:
          filters: *RELEASE_TAGS
      - unit:
          matrix:
            parameters:
              # 8.1 is the floor and 8.5 is the newest release. Testing only the
              # floor would let the plugin rot on modern PHP; testing only the
              # top would let it break on the version it claims. kanopi/firewall
              # supports 8.1 to 8.5, so the plugin's matrix covers the library's
              # rather than a subset of it.
              php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
          name: unit-php-<< matrix.php >>
          filters: *RELEASE_TAGS
      # The oldest WordPress the plugin header claims, on the oldest PHP.
      - integration:
          matrix:
            parameters:
              php: ["8.1"]
              wordpress: ["6.4"]
          name: integration-wp6.4-php8.1
          filters: *RELEASE_TAGS

      # Current WordPress on current PHP.
      - integration:
          matrix:
            parameters:
              php: ["8.3"]
              wordpress: ["latest"]
          name: integration-wplatest-php8.3
          filters: *RELEASE_TAGS

      # Next WordPress, so a break is found before a release rather than after.
      - integration:
          matrix:
            parameters:
              php: ["8.4"]
              wordpress: ["nightly"]
          name: integration-wpnightly-php8.4
          filters: *RELEASE_TAGS

      # Newest PHP, on the same WordPress as the job above it. The pair is the
      # point: these two differ only in PHP, so a failure here that passes there
      # says "PHP 8.5" and not "WordPress trunk moved". Integration is where
      # every defect this plugin has shipped so far has lived, which is why the
      # newest PHP gets a run of it rather than unit coverage alone.
      - integration:
          matrix:
            parameters:
              php: ["8.5"]
              wordpress: ["nightly"]
          name: integration-wpnightly-php8.5
          filters: *RELEASE_TAGS
      - package:
          filters: *RELEASE_TAGS

      # Publishes. Tags only -- `branches: ignore` is what guarantees a branch
      # build never reaches it -- and only after the full matrix, the version
      # check and the package smoke test have passed. A nightly WordPress
      # failure therefore holds a release too, deliberately: re-run the
      # workflow once trunk settles rather than releasing past a red job.
      - release:
          context: basic-firewall-release
          requires:
            - versions
            - static
            - unit-php-8.1
            - unit-php-8.2
            - unit-php-8.3
            - unit-php-8.4
            - unit-php-8.5
            - integration-wp6.4-php8.1
            - integration-wplatest-php8.3
            - integration-wpnightly-php8.4
            - integration-wpnightly-php8.5
            - package
          filters:
            tags:
              only: /^v?\d+\.\d+\.\d+.*/
            branches:
              ignore: /.*/
