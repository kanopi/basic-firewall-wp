name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Nothing here is allowed to fail softly. A security plugin whose test matrix is
# advisory is a security plugin nobody has tested.
permissions:
  contents: read

jobs:
  static:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: WordPress Coding Standards
        run: composer lint

      - name: PHPStan
        run: composer analyse

  unit:
    name: Unit tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor, declared in composer.json and enforced at runtime by
        # the guard in basic-firewall.php. 8.4 is what the library is developed
        # against. Testing only the floor would let the plugin rot on modern PHP;
        # testing only the top would let it break on the version it claims.
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: composer test:unit

  integration:
    name: Integration, WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest WordPress the plugin header claims, on the oldest PHP.
          - { wordpress: '6.4', php: '8.1' }
          # Current WordPress on current PHP.
          - { wordpress: 'latest', php: '8.3' }
          # Next WordPress, so a break is found before a release rather than after.
          - { wordpress: 'nightly', php: '8.4' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql
          coverage: none
          tools: composer:v2, wp-cli

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Install WordPress
        env:
          # A long random password so the literal-password assertion in
          # CredentialHandlingTest actually runs. On a site whose DB_PASSWORD is
          # "db" or "root" that search is meaningless and the test says so
          # instead of passing quietly -- see assertLiteralPasswordAbsent().
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-integration-password
        run: |
          mysql -h 127.0.0.1 -u root -proot -e \
            "ALTER USER 'root'@'%' IDENTIFIED BY '${DB_PASSWORD}';"
          wp core download --version=${{ matrix.wordpress }} --path=/tmp/wp --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress_test --dbuser=root \
            --dbpass="${DB_PASSWORD}" --dbhost=127.0.0.1 --allow-root
          wp core install --path=/tmp/wp --url=http://localhost:8080 \
            --title=CI --admin_user=admin --admin_password=password \
            --admin_email=ci@example.com --skip-email --allow-root

      - name: Link the plugin into the site
        run: |
          mkdir -p /tmp/wp/wp-content/plugins
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/basic-firewall
          wp plugin activate basic-firewall --path=/tmp/wp --allow-root

      - name: Integration tests
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist

      - name: WP-CLI smoke test
        run: |
          wp basic-firewall status --path=/tmp/wp --allow-root
          wp basic-firewall rebuild --path=/tmp/wp --allow-root
          wp basic-firewall rules --path=/tmp/wp --allow-root

      - name: End-to-end tests over real HTTP
        run: |
          # The only tests here that exercise the mu-plugin, the compiled file
          # on disk, the library's parse cache and the web server together --
          # which is where every defect this plugin has shipped so far lived.
          php -S 127.0.0.1:8080 -t /tmp/wp &
          sleep 3
          BFW_E2E_URL=http://127.0.0.1:8080 vendor/bin/phpunit -c phpunit-e2e.xml.dist

      - name: A destructive import must refuse without --yes
        run: |
          wp basic-firewall export --file=/tmp/fw.yml --path=/tmp/wp --allow-root
          if wp basic-firewall import /tmp/fw.yml --mode=replace \
               --path=/tmp/wp --allow-root < /dev/null; then
            echo "::error::import --mode=replace exited 0 without --yes"
            exit 1
          fi
          echo "Refused, as it must."

  package:
    name: Build and verify the release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Build the zip
        run: bash build/build-zip.sh

      # The point of the whole exercise: a zip that works where there is no
      # Composer at all. Installed onto a clean WordPress with the Composer
      # binary removed from PATH, then actually evaluated against a request.
      - name: Install the zip on a clean WordPress with no Composer
        run: |
          wp core download --path=/tmp/clean --allow-root
          wp config create --path=/tmp/clean --dbname=wp --dbuser=root \
            --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          sudo mv "$(command -v composer)" /usr/local/bin/composer.hidden
          ! command -v composer
          unzip -q build/dist/*.zip -d /tmp/clean/wp-content/plugins/
          test -d /tmp/clean/wp-content/plugins/basic-firewall/vendor
          echo "vendor/ is present in the installed plugin."

      - uses: actions/upload-artifact@v4
        with:
          name: basic-firewall-zip
          path: build/dist/*.zip
